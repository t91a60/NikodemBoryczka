<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c0a18"/>
      <stop offset="50%" stop-color="#241022"/>
      <stop offset="100%" stop-color="#140818"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#E95420" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#b070a8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b070a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="50%" stop-color="#E95420" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E95420" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#b070a8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid pattern -->
  <g opacity="0.015" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Avatar -->
  <rect x="80" y="100" width="80" height="80" rx="20" fill="url(#avatar)"/>
  <text x="120" y="153" text-anchor="middle" fill="#fff" font-family="Ubuntu, sans-serif" font-size="36" font-weight="700">NB</text>

  <!-- Name -->
  <text x="80" y="240" fill="#eee8ee" font-family="Ubuntu, sans-serif" font-size="48" font-weight="700" letter-spacing="1">Nikodem Boryczka</text>

  <!-- Title -->
  <text x="80" y="290" fill="#E95420" font-family="Ubuntu, sans-serif" font-size="26" font-weight="400">AI Developer &amp; Software Engineer</text>

  <!-- Accent line -->
  <rect x="80" y="330" width="200" height="3" rx="1.5" fill="url(#accent-line)"/>

  <!-- Tags -->
  <rect x="80" y="370" width="90" height="32" rx="6" fill="rgba(233,84,32,0.08)" stroke="rgba(233,84,32,0.2)" stroke-width="1"/>
  <text x="125" y="391" text-anchor="middle" fill="#E95420" font-family="Ubuntu Mono, monospace" font-size="14" font-weight="500">Python</text>

  <rect x="182" y="370" width="80" height="32" rx="6" fill="rgba(176,112,168,0.08)" stroke="rgba(176,112,168,0.2)" stroke-width="1"/>
  <text x="222" y="391" text-anchor="middle" fill="#b070a8" font-family="Ubuntu Mono, monospace" font-size="14" font-weight="500">React</text>

  <rect x="274" y="370" width="100" height="32" rx="6" fill="rgba(233,84,32,0.08)" stroke="rgba(233,84,32,0.2)" stroke-width="1"/>
  <text x="324" y="391" text-anchor="middle" fill="#E95420" font-family="Ubuntu Mono, monospace" font-size="14" font-weight="500">Docker</text>

  <rect x="386" y="370" width="85" height="32" rx="6" fill="rgba(176,112,168,0.08)" stroke="rgba(176,112,168,0.2)" stroke-width="1"/>
  <text x="428" y="391" text-anchor="middle" fill="#b070a8" font-family="Ubuntu Mono, monospace" font-size="14" font-weight="500">Flask</text>

  <rect x="483" y="370" width="95" height="32" rx="6" fill="rgba(233,84,32,0.08)" stroke="rgba(233,84,32,0.2)" stroke-width="1"/>
  <text x="530" y="391" text-anchor="middle" fill="#E95420" font-family="Ubuntu Mono, monospace" font-size="14" font-weight="500">PostgreSQL</text>

  <!-- Terminal section -->
  <rect x="80" y="440" width="1040" height="110" rx="10" fill="#120a10" stroke="rgba(233,84,32,0.06)" stroke-width="1"/>
  <rect x="80" y="440" width="1040" height="30" rx="10" fill="#1a0e18"/>
  <circle cx="110" cy="456" r="6" fill="#E95420"/>
  <circle cx="130" cy="456" r="6" fill="#F99B11" opacity="0.6"/>
  <circle cx="150" cy="456" r="6" fill="#0E8420" opacity="0.6"/>
  <text x="180" y="461" fill="#8a6a82" font-family="Ubuntu Mono, monospace" font-size="13">nikodem@dev-desktop: ~</text>

  <text x="100" y="500" fill="#0E8420" font-family="Ubuntu Mono, monospace" font-size="15">$ neofetch</text>
  <text x="100" y="525" fill="#E95420" font-family="Ubuntu Mono, monospace" font-size="14">Welcome to Ubuntu 24.04 LTS — Stack: Python Flask React PWA</text>
</svg>
